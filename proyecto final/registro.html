<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrate</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    


    <div id="registro" class="pagina-registro">
        <div class="panel-registro">
            <a href="#" class="cerrar-panel">&times;</a>
            <h2>Crear Cuenta</h2>
            
            <form action="/register-process" method="POST">
            <div class="grupo-campo">
                <label for="reg-nombre">Nombre Completo</label>
                <input type="text" id="reg-nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            
            <div class="grupo-campo">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" name="email" placeholder="correo@ejemplo.com" required>
            </div>
             <div class="grupo-campo">
                 <label for="login-password">Contraseña</label>
                 <input type="password" name="clave"><br><br>
                 <input type="checkbox" id="ver-password" class="mostrar-contrasena">
             </div>
            </div>
                <div class="acciones-registro">
                    <a href="index.html" class="boton-regresar">← Volver</a>
                    <button type="submit" class="boton-primario">Registrarse</button>
                    <button type="button" class="boton-limpiar" id="btnLimpiar">Limpiar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
